services:
  - type: web
    name: employee-orga-fullstack
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    releaseCommand: npm run prisma:migrate:deploy
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orga-db
          property: connectionString

databases:
  - name: orga-db
    plan: free



